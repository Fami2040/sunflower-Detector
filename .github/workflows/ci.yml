name: ci

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Syntax check (compileall)
        env:
          PYTHONPATH: .
        run: python -m compileall -q .

      - name: Install scientific deps for unit tests (not full requirements.txt)
        run: pip install "scipy>=1.10.0" "matplotlib>=3.7.0"

      - name: Unit tests (stdlib unittest)
        env:
          PYTHONPATH: .
          HARCHOC_ALLOW_BASE_PYTHON: "1"
          HARCHOC_QUIET: "1"
        run: python -m unittest discover -s tests -p "test_*.py"

